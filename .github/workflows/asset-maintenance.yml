name: Project quality and asset coverage
on:
  push:
    branches: [work, main]

  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run install:ci
      - run: node scripts/maintain-assets.mjs
      - run: npm run assets:check && npm run check && npm run lint && npm run test:unit
      - run: npm run build
