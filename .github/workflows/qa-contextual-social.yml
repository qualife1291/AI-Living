name: QA Contextual Social — Unit, Real Assets and Browser Frames
on:
  push:
    branches: [cloudflare-qa]
  workflow_dispatch:
  pull_request:
    branches: [cloudflare-qa]
    paths:
      - 'lib/living/social.ts'
      - 'scripts/test-social.mjs'
      - 'lib/living/interaction.ts'
      - 'scripts/test-visitor-context.mjs'
      - 'components/city/three/runtime.ts'
      - 'app/globals.css'
      - 'scripts/qa-social.py'
      - 'scripts/unit-suites.json'
      - 'lib/city/appearance.ts'
      - 'lib/city/neighborhood-props.ts'
      - 'components/city/three/interior.ts'
      - 'components/city/InteriorView.tsx'
      - 'components/city/City3D.tsx'
      - 'app/page.tsx'
      - 'lib/city/interior-actions.ts'
      - 'scripts/test-interior-actions.mjs'
      - 'data/city/action-pack-100.json'
      - 'lib/living/learning.ts'
      - 'lib/living/engine.ts'
      - 'scripts/test-action-pack-100.mjs'
      - 'components/city/three/actor-actions.ts'
      - 'data/characters/themes.json'
      - '.github/workflows/qa-contextual-social.yml'
permissions:
  contents: read
concurrency:
  group: qa-city-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contextual-social:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      XOM_TEST_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Social dialogues and full isolated unit suite
        run: |
          node scripts/test-social.mjs
          node scripts/test-visitor-context.mjs
          node scripts/test-interior-actions.mjs
          node scripts/test-h6-shadow-evaluator.mjs
          node scripts/test-h6-qa-canary.mjs
          node scripts/test-qa-h6-release.mjs
          npm run test:unit
      - name: Type, lint and real 3D model compatibility
        run: |
          npm run check
          npm run lint
          npm run assets:check
          node scripts/test-neighborhood.mjs
      - name: Build app for loopback-only visual QA
        run: npm run build
      - name: Install isolated browser test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium
          python3 -m venv /tmp/ai-living-browser-venv
          /tmp/ai-living-browser-venv/bin/pip install playwright pillow
      - name: Start local Worker (no remote D1 or QA writes)
        run: |
          mkdir -p qa-evidence/social
          (npm run start -- --port 5177 >qa-evidence/social/local-server.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:5177; then exit 0; fi
            sleep 2
          done
          tail -100 qa-evidence/social/local-server.log
          exit 1
      - name: Chromium desktop/mobile 3D frames, 60-second activity evidence and real screenshots
        env:
          QA_BASE: http://127.0.0.1:5177
          QA_OUT: qa-evidence/social/screenshots
        run: /tmp/ai-living-browser-venv/bin/python scripts/qa-social.py
      - name: Upload real browser screenshots and local server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-contextual-social-${{ github.sha }}
          path: qa-evidence/social
          if-no-files-found: warn
          retention-days: 14
